<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Watermelon Games</title>
  <link rel="stylesheet" href="/style.css">
<style>
  .games-hero {
    padding: 55px 0 25px;
  }

  .game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 18px;
    padding-bottom: 60px;
  }

  .game-card {
    text-decoration: none;
    color: white;
    background: #121212;
    border-radius: 14px;
    overflow: hidden;
    transition: 0.2s;
  }

  .game-card:hover {
    transform: scale(1.04);
  }

.game-image {
  width: 100%;
  height: 180px;
  overflow: hidden;
  background: #242424;
  display: grid;
  place-items: center;
}

.game-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

  .game-card span {
    display: block;
    padding: 12px;
    font-weight: 700;
  }

  .logout {
    margin: 20px 0 40px;
  }
</style>
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
     <a class="brand" href="/games">🍉 Watermelon Games</a>
      <form action="/logout" method="post">
        <button class="button secondary" type="submit">Log out</button>
      </form>
    </div>
  </header>

  <main class="wrap">
    <section class="games-hero">
      <p class="eyebrow">Private area</p>
      <h1>Watermelon Games</h1>
      <p class="lead"><p class="lead">Choose a game and start playing.</p></p>
    </section>

<section class="game-grid">

 <a class="game-card" href="/play/granny">
  <div class="game-image">
    <img src="/images/granny.png" alt="Granny">
  </div>
  <span>Granny</span>
</a>

  <a class="game-card" href="#">
    <div class="game-image">GAME 2</div>
    <span>Coming Soon</span>
  </a>

  <a class="game-card" href="#">
    <div class="game-image">GAME 3</div>
    <span>Coming Soon</span>
  </a>

  <a class="game-card" href="#">
    <div class="game-image">GAME 4</div>
    <span>Coming Soon</span>
  </a>

  <a class="game-card" href="#">
    <div class="game-image">GAME 5</div>
    <span>Coming Soon</span>
  </a>

  <a class="game-card" href="#">
    <div class="game-image">GAME 6</div>
    <span>Coming Soon</span>
  </a>

</section>
  </main>
</body>
</html>
